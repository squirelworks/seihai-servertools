[package]
name = "seihai-code"
description = "Client .code caches (GWEBL001, GRESCR01): show, CRC, dump and pack."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "seihai_code"
path = "src/lib.rs"

[[bin]]
name = "seihai-code"
path = "src/main.rs"

[dependencies]
# seihai-core comes through lat-core, at the one pin in the root
# Cargo.toml ([workspace.dependencies]); see README.md.
lat-core.workspace = true

[dev-dependencies]
tempfile.workspace = true
