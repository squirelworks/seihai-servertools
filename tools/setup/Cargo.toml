[package]
name = "seihai-setup"
description = "Go-public setup on the command line: take a gserver folder public and back, host a listserver, player limits, HQ passwords."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "seihai_setup"
path = "src/lib.rs"

[[bin]]
name = "seihai-setup"
path = "src/main.rs"

[dependencies]
# No seihai-core: setup-core needs none.
setup-core.workspace = true
ctrlc.workspace = true

[dev-dependencies]
tempfile.workspace = true
