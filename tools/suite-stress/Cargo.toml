[package]
name = "seihai-suite-stress"
description = "Integration and stress rig for the Seihai server suite: brings up listserver, gserver, NPC-server and RC together on loopback and drives bot clients."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "seihai_suite_stress"
path = "src/lib.rs"

[[bin]]
name = "seihai-suite-stress"
path = "src/main.rs"

[dependencies]
# Used directly (codecs, version profiles), at the one pin in the root
# Cargo.toml ([workspace.dependencies]); see README.md.
seihai-core.workspace = true
ctrlc.workspace = true

[dev-dependencies]
tempfile.workspace = true
