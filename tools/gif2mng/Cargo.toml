[package]
name = "seihai-gif2mng"
description = "gif2mng: a GIF as a PNG (one frame) or an MNG animation."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "seihai_gif2mng"
path = "src/lib.rs"

[[bin]]
name = "seihai-gif2mng"
path = "src/main.rs"

[dependencies]
# seihai-core comes through lat-core, at the one pin in the root
# Cargo.toml ([workspace.dependencies]); see README.md.
lat-core.workspace = true

[dev-dependencies]
tempfile.workspace = true
