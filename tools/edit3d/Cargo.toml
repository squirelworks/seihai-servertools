[package]
name = "seihai-edit3d"
description = "A standalone 3D level editor for seihai-gserver worlds: the 3D world file, its streamed terrain, and a live preview."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "seihai_edit3d"
path = "src/lib.rs"

[[bin]]
name = "seihai-edit3d"
path = "src/main.rs"

[features]
# The window. Build with `--no-default-features` for the edit and render
# commands only (no eframe), as on a headless server.
default = ["window"]
window = ["dep:eframe", "dep:egui"]

[dependencies]
# The world file, terrain, shapes and preview (AGENTS.md: logic in the core
# crates). seihai-core comes through it, at the one pin in the root.
lat-core.workspace = true
# Saving the owner's files: dated backups, write through a temporary file.
setup-core.workspace = true
# The window.
eframe = { workspace = true, optional = true }
egui = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true
