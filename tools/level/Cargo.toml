[package]
name = "seihai-level"
description = "Level convert (.nw, .graal, .zelda, Tiled .tmx), level render to PNG, and LevelFiller theme fills."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "seihai_level"
path = "src/lib.rs"

[[bin]]
name = "seihai-level"
path = "src/main.rs"

[dependencies]
# seihai-core comes through lat-core, at the one pin in the root
# Cargo.toml ([workspace.dependencies]); see README.md.
lat-core.workspace = true

[dev-dependencies]
tempfile.workspace = true
png.workspace = true
