name: Release

# Builds on a v* tag (and by hand). No tag without Squirrel's go-ahead.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to draft, without the v (e.g. 0.1.0). Leave empty to build only.'
        required: false
        default: ''

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            name: seihai-servertools-linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: seihai-servertools-windows-x86_64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            name: seihai-servertools-macos-x86_64
          - os: macos-15
            target: aarch64-apple-darwin
            name: seihai-servertools-macos-aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --release -p seihai-servertools --target ${{ matrix.target }}
      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist/${{ matrix.name }}
          cp target/${{ matrix.target }}/release/seihai-servertools README.md LICENSE-MIT LICENSE-APACHE dist/${{ matrix.name }}/
          cp scripts/lab/start.sh scripts/lab/start.command dist/${{ matrix.name }}/
          tar czf ${{ matrix.name }}.tar.gz -C dist ${{ matrix.name }}
      - name: Package (windows)
        if: runner.os == 'Windows'
        run: |
          New-Item -ItemType Directory -Force dist/${{ matrix.name }}
          Copy-Item target/${{ matrix.target }}/release/seihai-servertools.exe,README.md,LICENSE-MIT,LICENSE-APACHE,scripts/lab/start.bat dist/${{ matrix.name }}/
          Compress-Archive -Path dist/${{ matrix.name }} -DestinationPath ${{ matrix.name }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            ${{ matrix.name }}.tar.gz
            ${{ matrix.name }}.zip

  # Drafts only. The tag is made when Squirrel presses Publish on the draft, so
  # nothing is tagged or released without the owner's go-ahead. See RELEASES.md
  # in squirelworks/seihai.
  draft:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.version != ''
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
          TITLE: seihai-servertools
        run: |
          if [ -n "$INPUT_VERSION" ]; then TAG="v$INPUT_VERSION"; else TAG="$GITHUB_REF_NAME"; fi
          echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$' || { echo "::error::bad version $TAG"; exit 1; }
          CARGO=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          [ "v$CARGO" = "$TAG" ] || echo "::warning::Cargo.toml says $CARGO, the release is $TAG"
          ls -l dist
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if [ "$(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json isDraft -q .isDraft)" = true ]; then
              gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber dist/*
            else
              echo "$TAG is already published; leaving it as it is."
            fi
          else
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" \
              --title "$TITLE ${TAG#v}" --generate-notes dist/*
          fi
          echo "Draft: $(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json url -q .url)" >> "$GITHUB_STEP_SUMMARY"
