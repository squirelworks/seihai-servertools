[package]
name = "seihai-servertools"
description = "Seihai server tools: one-step lab start, go-public setup, LAT level/NPC/gani editors and a world checker."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "seihai-servertools"
path = "src/main.rs"

[features]
# The window (`seihai-servertools gui`). On by default; build with
# `--no-default-features` for a command-line-only binary on a headless server.
default = ["gui"]
gui = ["dep:servertools-app"]

[dependencies]
setup-core.workspace = true
lat-core.workspace = true
servertools-app = { workspace = true, optional = true }
ctrlc.workspace = true

[dev-dependencies]
tempfile.workspace = true
