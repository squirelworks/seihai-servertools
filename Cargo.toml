[workspace]
members = [
    "crates/setup-core",
    "crates/lat-core",
    "crates/app",
    "crates/seihai-servertools",
    "crates/suite-stress",
]
resolver = "2"

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/squirelworks/seihai-servertools"
publish = false

[workspace.dependencies]
# Protocol, asset parsers (levels, gmaps, ganis) and scripting shared with
# the Seihai client. Pinned on purpose; never follow a branch.
# See docs/ARCHITECTURE.md, "Code shared with Seihai".
#
# seihai-core lives in its own repo (squirelworks/seihai-core). seihai-draw
# still comes from seihai, and seihai pins one seihai-core rev in its root
# Cargo.toml. Pin seihai-core here to that same rev, so a Level or Gani from
# the parser is the same type seihai-draw paints. Bump both together.
seihai-core = { git = "https://github.com/squirelworks/seihai-core", rev = "dd6c88eb2e2ff4fc3177c4038869bdc4e580a132", default-features = false }
seihai-draw = { git = "https://github.com/squirelworks/seihai", rev = "688c135cac7ba9c527798d1daedc49e877a9c94d" }
# RC file link: list_dir, get_file, put_file. Those methods are on
# seihai-rc main (294f2c1, file link in #5, NPC commands in #6). No tag yet.
seihai-rc = { git = "https://github.com/squirelworks/seihai-rc", rev = "294f2c119e0d2f00a6241cc64eefef535ca166f5" }
# The window. Same versions as the Seihai client and its level editor.
eframe = "0.29"
egui = "0.29"
ctrlc = "3"
# Edits seihai-listserver.toml keeping comments, order and unknown keys.
toml_edit = "0.22"
# This machine's addresses for the "Listen on" lists (MIT OR BSD-3-Clause).
if-addrs = "0.15"
tempfile = "3"
# Resource packages (.gpak/.gpake, lat-core::gpak): the ZIP container, the
# DES the encrypted entries use, and a random key. All MIT or MIT/Apache.
zip = { version = "9", default-features = false, features = ["deflate"] }
des = "0.8"
getrandom = "0.2"

setup-core = { path = "crates/setup-core" }
lat-core = { path = "crates/lat-core" }
servertools-app = { path = "crates/app" }
