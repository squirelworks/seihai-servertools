[workspace]
members = [
    "crates/setup-core",
    "crates/lat-core",
    "crates/app",
    "crates/seihai-servertools",
]
resolver = "2"

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/squirelworks/seihai-servertools"
publish = false

[workspace.dependencies]
# Protocol, asset parsers (levels, gmaps, ganis) and scripting shared with
# the Seihai client. Pinned on purpose; never follow a branch.
# See docs/ARCHITECTURE.md, "Code shared with Seihai".
#
# seihai-draw (tile and gani RGBA) is on seihai main, merge 72bb8d2, and is
# not in a tag yet (v0.0.5 is the newest tag, and it does not contain the
# crate). seihai-core is pinned to that same commit so a Level or Gani from
# the parser is the same type seihai-draw paints. Bump both together.
seihai-core = { git = "https://github.com/squirelworks/seihai", rev = "72bb8d29a977e7185bb7499bd36b732751ea0c6e", default-features = false }
seihai-draw = { git = "https://github.com/squirelworks/seihai", rev = "72bb8d29a977e7185bb7499bd36b732751ea0c6e" }
# RC file link: list_dir, get_file, put_file. Those methods are on
# seihai-rc main (294f2c1, file link in #5, NPC commands in #6). No tag yet.
seihai-rc = { git = "https://github.com/squirelworks/seihai-rc", rev = "294f2c119e0d2f00a6241cc64eefef535ca166f5" }
# The window. Same versions as the Seihai client and its level editor.
eframe = "0.29"
egui = "0.29"
ctrlc = "3"
# Edits seihai-listserver.toml keeping comments, order and unknown keys.
toml_edit = "0.22"
tempfile = "3"

setup-core = { path = "crates/setup-core" }
lat-core = { path = "crates/lat-core" }
servertools-app = { path = "crates/app" }
