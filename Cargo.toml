[workspace]
members = [
    "crates/setup-core",
    "crates/lat-core",
    "crates/app",
    "crates/seihai-servertools",
    "crates/suite-stress",
]
resolver = "2"

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/squirelworks/seihai-servertools"
publish = false

[workspace.dependencies]
# Protocol, asset parsers (levels, gmaps, ganis) and scripting shared with
# the Seihai client. Pinned on purpose; never follow a branch.
# See docs/ARCHITECTURE.md, "Code shared with Seihai".
#
# seihai-core and seihai-draw both live in squirelworks/seihai-core and are
# tagged together, so one tag pins both and a Level or Gani from the parser
# is the same type seihai-draw paints.
seihai-core = { git = "https://github.com/squirelworks/seihai-core", tag = "v0.1.0", default-features = false }
seihai-draw = { git = "https://github.com/squirelworks/seihai-core", tag = "v0.1.0" }
# RC file link: list_dir, get_file, put_file. seihai-rc dd10322 (#45), on seihai-core
# v0.1.0, so the build has one core. No rc tag yet.
seihai-rc = { git = "https://github.com/squirelworks/seihai-rc", rev = "dd103226dca1bedbeb983bc523a17259b81f118f" }
# The window. Same versions as the Seihai client and its level editor.
eframe = "0.29"
egui = "0.29"
ctrlc = "3"
# Edits seihai-listserver.toml keeping comments, order and unknown keys.
toml_edit = "0.22"
# This machine's addresses for the "Listen on" lists (MIT OR BSD-3-Clause).
if-addrs = "0.15"
tempfile = "3"
# check --make-gif: read PNG art, write GIF copies for pre-2.1 clients
# (both MIT OR Apache-2.0, pure Rust).
png = "0.18"
gif = "0.13"
# Resource packages (.gpak/.gpake, lat-core::gpak): the ZIP container, the
# DES the encrypted entries use, and a random key. All MIT or MIT/Apache.
zip = { version = "9", default-features = false, features = ["deflate"] }
des = "0.8"
getrandom = "0.2"

setup-core = { path = "crates/setup-core" }
lat-core = { path = "crates/lat-core" }
servertools-app = { path = "crates/app" }
