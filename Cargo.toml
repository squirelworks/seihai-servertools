[workspace]
# crates/: the shared libraries and the all-in-one `seihai-servertools`.
# tools/: one crate and binary per tool, each built and tested on its own
# (`cargo build -p seihai-<tool>`; tools/README.md).
members = [
    "crates/setup-core",
    "crates/lat-core",
    "crates/app",
    "crates/seihai-servertools",
    "tools/*",
]
resolver = "2"

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/squirelworks/seihai-servertools"
publish = false

[workspace.dependencies]
# Protocol, asset parsers (levels, gmaps, ganis) and scripting shared with
# the Seihai client. Pinned on purpose; never follow a branch.
# See docs/ARCHITECTURE.md, "Code shared with Seihai".
#
# seihai-core and seihai-draw both live in squirelworks/seihai-core and are
# tagged together, so one tag pins both and a Level or Gani from the parser
# is the same type seihai-draw paints.
seihai-core = { git = "https://github.com/squirelworks/seihai-core", tag = "v0.7.2", default-features = false }
seihai-draw = { git = "https://github.com/squirelworks/seihai-core", tag = "v0.7.2" }
# RC file link: list_dir, get_file, put_file. Pinned to a seihai-rc main
# commit on seihai-core v0.7.2, so this workspace has one core
# (squirelworks/seihai-core#79, #123). No rc tag on that core yet; move to
# seihai-rc v0.2.0 when it ships.
seihai-rc = { git = "https://github.com/squirelworks/seihai-rc", rev = "fcfd2cc264fece3838a1acca56b1d2d3cc217a17" }
# The window. Same versions as the Seihai client and its level editor.
eframe = "0.29"
egui = "0.29"
# The default font of movie TEXT actors (Ubuntu Light, already in the tree
# through egui).
epaint_default_fonts = "0.29"
ctrlc = "3"
# Edits seihai-listserver.toml keeping comments, order and unknown keys.
toml_edit = "0.22"
# This machine's addresses for the "Listen on" lists (MIT OR BSD-3-Clause).
if-addrs = "0.15"
tempfile = "3"
# check --make-gif: read PNG art, write GIF copies for pre-2.1 clients
# (both MIT OR Apache-2.0, pure Rust).
png = "0.18"
gif = "0.13"
# Resource packages (.gpak/.gpake, lat-core::gpak): the ZIP container, the
# DES the encrypted entries use, and a random key. All MIT or MIT/Apache.
flate2 = "1"
zip = { version = "9", default-features = false, features = ["deflate"] }
des = "0.8"
getrandom = "0.2"

setup-core = { path = "crates/setup-core" }
lat-core = { path = "crates/lat-core" }
servertools-app = { path = "crates/app" }
seihai-guide = { path = "tools/guide" }
seihai-lab = { path = "tools/lab" }
seihai-setup = { path = "tools/setup" }
seihai-check = { path = "tools/check" }
seihai-code = { path = "tools/code" }
seihai-gpak = { path = "tools/gpak" }
seihai-level = { path = "tools/level" }
seihai-theme = { path = "tools/theme" }
seihai-gmap = { path = "tools/gmap" }
seihai-gani = { path = "tools/gani" }
seihai-gen = { path = "tools/gen" }
seihai-stats = { path = "tools/stats" }
seihai-gif2mng = { path = "tools/gif2mng" }
seihai-servertools-gui = { path = "tools/gui" }

