[workspace]
members = [
    "crates/setup-core",
    "crates/lat-core",
    "crates/app",
    "crates/seihai-servertools",
]
resolver = "2"

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/squirelworks/seihai-servertools"
publish = false

[workspace.dependencies]
# Protocol, asset parsers (levels, gmaps, ganis) and scripting shared with
# the Seihai client. Pinned by tag; bump it on purpose, never follow a branch.
# See docs/ARCHITECTURE.md, "Code shared with Seihai".
seihai-core = { git = "https://github.com/squirelworks/seihai", tag = "v0.0.3", default-features = false }
# The window. Same versions as the Seihai client and its level editor.
eframe = "0.29"
egui = "0.29"
ctrlc = "3"
# Edits seihai-listserver.toml keeping comments, order and unknown keys.
toml_edit = "0.22"
tempfile = "3"

setup-core = { path = "crates/setup-core" }
lat-core = { path = "crates/lat-core" }
servertools-app = { path = "crates/app" }
